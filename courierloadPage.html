<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mariposa - Pending Orders</title>
  <link rel="stylesheet" href="courierloadPage.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-content">
      <!-- Left Section: Logo + "About Us" -->
      <div class="header-left">
        <img src="RESOURCES/RESOURCES/imgFiles/Logo.png" alt="Mariposa Logo" class="logo">
        <nav>
          <ul>
            <li><a href="#">About Us</a></li>
          </ul>
        </nav>
      </div>

      <!-- Right Section: User Name -->
      <div class="user-name">
        Account Info
      </div>
    </div>
  </header>

  <!-- WAVE / HERO SECTION -->
  <section class="hero">
    <!-- Curved wave shape at the bottom of the green section -->
    <svg class="wave" viewBox="0 0 500 150" preserveAspectRatio="none">
      <!-- Adjust the path to customize the wave curve -->
      <path d="M0,40 C150,80 350,0 500,40 L500,0 L0,0 Z" style="fill: #ffffff;"></path>
    </svg>
  </section>

  <!-- MAIN CONTENT -->
  <main>
    <div class="orders-header">
      <h2 class="pending-orders">Your Pending Orders</h2>
      <span class="order-count">Number of Orders: 4</span>
    </div>

    <!-- ORDER CARDS -->
    <div class="card-container">
      <!-- CARD 1 -->
      <div class="order-card">
        <h3>Jasmine Rice</h3>
        <button class="address-btn">View Address</button>
        <div class="checkboxes">
          <label><input type="checkbox"> Pick-up</label>
          <label><input type="checkbox"> On the Way</label>
          <label><input type="checkbox"> Delivered</label>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="order-card">
        <h3>Jasmine Rice</h3>
        <button class="address-btn">View Address</button>
        <div class="checkboxes">
          <label><input type="checkbox"> Pick-up</label>
          <label><input type="checkbox"> On the Way</label>
          <label><input type="checkbox"> Delivered</label>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="order-card">
        <h3>Maia Rice</h3>
        <button class="address-btn">View Address</button>
        <div class="checkboxes">
          <label><input type="checkbox"> Pick-up</label>
          <label><input type="checkbox"> On the Way</label>
          <label><input type="checkbox"> Delivered</label>
        </div>
      </div>

      <!-- CARD 4 -->
      <div class="order-card">
        <h3>Bulaklak Rice</h3>
        <button class="address-btn">View Address</button>
        <div class="checkboxes">
          <label><input type="checkbox"> Pick-up</label>
          <label><input type="checkbox"> On the Way</label>
          <label><input type="checkbox"> Delivered</label>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
