<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mariposa - Edit Account Information</title>
  <!-- Link to CSS -->
  <link rel="stylesheet" href="couriereditaccountinfo.css">
</head>
<body>

  <!-- Header Section -->
  <header>
    <!-- Logo -->
    <div class="logo-container">
    
      <img src="RESOURCES/RESOURCES/imgFiles/Logo.png" alt="Mariposa Logo" class="logo">
    </div>

    <!-- Go Back Button -->
    <button class="go-back">Go Back</button>
  </header>

  <!-- Main Content Section -->
  <section class="content">
    <!-- Edit Account Panel -->
    <div class="edit-panel">
      <h1>Edit Account Information</h1>
      <form>
        <div class="form-group">
          <label>Username:</label>
          <input type="text" placeholder="Username">
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" placeholder="Password">
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" placeholder="Email">
        </div>
        <div class="form-group">
          <label>Firstname:</label>
          <input type="text" placeholder="Firstname">
        </div>
        <div class="form-group">
          <label>Lastname:</label>
          <input type="text" placeholder="Lastname">
        </div>
        <div class="form-group">
          <label>Mobile Num:</label>
          <input type="text" placeholder="Mobile Number">
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="button" class="logout-btn">Logout</button>
          <button type="submit" class="save-btn">Save</button>
        </div>
      </form>
    </div>

    <div class="image-panel">
    
      <img src="RESOURCES/RESOURCES/imgFiles/Couriereditaccountinfo-Page/account_info_Truck.jpg" alt="Truck Image">
    </div>
  </section>

</body>
</html>
